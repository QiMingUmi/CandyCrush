// A short jQuery extension to read query parameters from the URL.
$.extend({
  getUrlVars: function() {
    var vars = [], pair;
    var pairs = window.location.search.substr(1).split('&');
    for (var i = 0; i < pairs.length; i++) {
      pair = pairs[i].split('=');
      vars.push(pair[0]);
      vars[pair[0]] = pair[1] &&
          decodeURIComponent(pair[1].replace(/\+/g, ' '));
    }
    return vars;
  },
  getUrlVar: function(name) {
    return $.getUrlVars()[name];
  }
});

function creatNewTable() {
  board.clear()
  rules.prepareNewGame()

  let table = document.getElementById("myTable");

  for(var i = 0;i < DEFAULT_BOARD_SIZE;i++){
    let tr = document.createElement('tr')
    tr.setAttribute("index",i);
    //var row = table.insertRow(-1);//插入新行，-1表示最后插入
    for(var j = 0;j < DEFAULT_BOARD_SIZE;j++){
      let td = document.createElement('td')
      td.setAttribute("index",i);
      var num = i + 1;
      td.innerText = String.fromCharCode('a'.charCodeAt(0) + j) + num;//设置单元格的内容和编号
      td.style.backgroundColor = board.square[i][j].color;//设置单元格背景颜色
      //设置文字颜色
      if(board.square[i][j].color !== 'yellow'){
        td.style.color = 'white';
      }
      else{
        td.style.color = 'grey';
      }
      tr.appendChild(td);
      //var cell = row.insertCell(-1);//插入新单元格，-1表示最后插入
      //cell.innerText = String.fromCharCode('a'.charCodeAt(0) + j - 1) + i;//设置单元格的内容和编号
    }
    table.appendChild(tr);
    // 添加表格标题
    let caption = document.createElement('caption');
    caption.innerText = "图1 - 使用标准HTML元素的简单消消乐UI";
  }

}
